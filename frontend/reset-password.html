<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RetailHub | Set New Password</title>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    body {
      background: radial-gradient(circle at top right, #065f46, #091f17 75%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .auth-card {
      width: 100%;
      max-width: 450px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
      padding: 34px;
      border: 1px solid var(--border);
    }
    .auth-alert {
      display: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12.5px;
      margin-bottom: 16px;
      align-items: center;
      gap: 8px;
    }
    .auth-alert.error {
      display: flex;
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    .auth-alert.success {
      display: flex;
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div style="text-align: center; margin-bottom: 22px;">
      <div class="brand-icon" style="margin: 0 auto 12px; width: 48px; height: 48px; font-size: 20px; background: linear-gradient(135deg, #059669, #10b981); color: white; border-radius: 12px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(5, 150, 105, 0.3);">
        <i class="fa-solid fa-lock-open"></i>
      </div>
      <h2 style="font-size: 22px; font-weight: 800; color: var(--text-main);">Create New Password</h2>
      <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">
        Choose a secure password for your RetailHub merchant account.
      </p>
    </div>

    <div id="resetAlert" class="auth-alert">
      <i class="fa-solid fa-circle-info" id="alertIcon"></i>
      <div id="alertMsg"></div>
    </div>

    <form id="resetForm" onsubmit="handleResetSubmit(event)">
      <div class="form-group">
        <label class="form-label">Account Email <span class="required">*</span></label>
        <div class="input-group">
          <i class="fa-regular fa-envelope input-prefix"></i>
          <input type="email" id="email" class="form-control has-prefix" required placeholder="manager@retailhub.com">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Verification Code / Token <span class="required">*</span></label>
        <div class="input-group">
          <i class="fa-solid fa-hashtag input-prefix"></i>
          <input type="text" id="resetToken" class="form-control has-prefix" required placeholder="e.g. RH-123456">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">New Password (Min 6 Characters) <span class="required">*</span></label>
        <div class="input-group">
          <i class="fa-solid fa-lock input-prefix"></i>
          <input type="password" id="newPassword" class="form-control has-prefix has-suffix" required minlength="6" placeholder="Enter new password">
          <i class="fa-regular fa-eye input-suffix" id="togglePassBtn1" style="cursor: pointer;" onclick="togglePass('newPassword', 'togglePassBtn1')"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Confirm New Password <span class="required">*</span></label>
        <div class="input-group">
          <i class="fa-solid fa-check-double input-prefix"></i>
          <input type="password" id="confirmPassword" class="form-control has-prefix has-suffix" required minlength="6" placeholder="Re-enter new password">
          <i class="fa-regular fa-eye input-suffix" id="togglePassBtn2" style="cursor: pointer;" onclick="togglePass('confirmPassword', 'togglePassBtn2')"></i>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary btn-lg" style="width: 100%; font-size: 14.5px; font-weight: 700;">
        <i class="fa-solid fa-shield-halved"></i> Update & Sign In
      </button>

      <div style="text-align: center; margin-top: 18px; font-size: 13px;">
        <a href="login.html" style="color: var(--primary); font-weight: 600;">
          <i class="fa-solid fa-arrow-left"></i> Cancel and Return to Sign In
        </a>
      </div>
    </form>
  </div>

  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    function togglePass(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (input.type === "password") {
        input.type = "text";
        icon.className = "fa-regular fa-eye-slash input-suffix";
      } else {
        input.type = "password";
        icon.className = "fa-regular fa-eye input-suffix";
      }
    }

    async function handleResetSubmit(e) {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const token = document.getElementById("resetToken").value.trim();
      const p1 = document.getElementById("newPassword").value;
      const p2 = document.getElementById("confirmPassword").value;
      const alertBox = document.getElementById("resetAlert");
      const alertMsg = document.getElementById("alertMsg");
      const btn = document.getElementById("submitBtn");

      if (p1 !== p2) {
        alertBox.className = "auth-alert error";
        alertBox.style.display = "flex";
        alertMsg.textContent = "Passwords do not match!";
        return showToast("Passwords do not match!", "error");
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Updating Password...';

      try {
        const res = await api.resetPassword(email, token, p1);

        if (!res.success) {
          alertBox.className = "auth-alert error";
          alertBox.style.display = "flex";
          alertMsg.textContent = res.error || "Password reset failed. Invalid or expired token.";
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-shield-halved"></i> Update & Sign In';
          return;
        }

        alertBox.className = "auth-alert success";
        alertBox.style.display = "flex";
        alertMsg.textContent = res.message || "Password updated! Redirecting to sign in...";
        showToast("Password updated successfully!", "success");

        setTimeout(() => {
          window.location.href = "login.html";
        }, 1200);
      } catch (err) {
        alertBox.className = "auth-alert error";
        alertBox.style.display = "flex";
        alertMsg.textContent = "Server error. Please try again.";
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-shield-halved"></i> Update & Sign In';
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const emailParam = params.get("email");
      const tokenParam = params.get("token");
      if (emailParam) document.getElementById("email").value = emailParam;
      if (tokenParam) document.getElementById("resetToken").value = tokenParam;
    });
  </script>
</body>
</html>

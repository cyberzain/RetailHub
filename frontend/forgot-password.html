<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RetailHub | Reset Password</title>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    body {
      background: radial-gradient(circle at top right, #065f46, #091f17 75%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
      padding: 36px;
      border: 1px solid var(--border);
    }
    .auth-alert {
      display: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12.5px;
      margin-bottom: 16px;
      align-items: center;
      gap: 8px;
    }
    .auth-alert.error {
      display: flex;
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    .auth-alert.success {
      display: flex;
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div style="text-align: center; margin-bottom: 24px;">
      <div class="brand-icon" style="margin: 0 auto 12px; width: 48px; height: 48px; font-size: 20px; background: linear-gradient(135deg, #059669, #10b981); color: white; border-radius: 12px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(5, 150, 105, 0.3);">
        <i class="fa-solid fa-key"></i>
      </div>
      <h2 style="font-size: 22px; font-weight: 800; color: var(--text-main);">Forgot Password?</h2>
      <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">
        Enter your registered email and we'll generate your password reset authorization code.
      </p>
    </div>

    <div id="forgotAlert" class="auth-alert">
      <i class="fa-solid fa-circle-info" id="alertIcon"></i>
      <div id="alertMsg"></div>
    </div>

    <form id="forgotForm" onsubmit="handleForgot(event)">
      <div class="form-group">
        <label class="form-label">Registered Account Email <span class="required">*</span></label>
        <div class="input-group">
          <i class="fa-regular fa-envelope input-prefix"></i>
          <input type="email" id="resetEmail" class="form-control has-prefix" required placeholder="manager@retailhub.com" value="manager@retailhub.com">
        </div>
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary btn-lg" style="width: 100%; font-size: 14.5px; font-weight: 700;">
        <i class="fa-solid fa-paper-plane"></i> Send Password Reset Code
      </button>

      <div style="text-align: center; margin-top: 20px; font-size: 13px;">
        <a href="login.html" style="color: var(--primary); font-weight: 600;">
          <i class="fa-solid fa-arrow-left"></i> Back to Sign In
        </a>
      </div>
    </form>
  </div>

  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    async function handleForgot(e) {
      e.preventDefault();
      const email = document.getElementById("resetEmail").value.trim();
      const alertBox = document.getElementById("forgotAlert");
      const alertMsg = document.getElementById("alertMsg");
      const btn = document.getElementById("submitBtn");

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';

      try {
        const res = await api.forgotPassword(email);

        if (!res.success) {
          alertBox.className = "auth-alert error";
          alertBox.style.display = "flex";
          alertMsg.textContent = res.error || "Could not generate reset code.";
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Send Password Reset Code';
          return;
        }

        alertBox.className = "auth-alert success";
        alertBox.style.display = "flex";
        alertMsg.textContent = res.message || "Reset code generated. Redirecting...";
        showToast("Reset verification code generated!", "success");

        setTimeout(() => {
          window.location.href = `reset-password.html?email=${encodeURIComponent(email)}&token=${encodeURIComponent(res.token || '')}`;
        }, 1200);
      } catch (err) {
        alertBox.className = "auth-alert error";
        alertBox.style.display = "flex";
        alertMsg.textContent = "Server error. Please try again.";
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Send Password Reset Code';
      }
    }
  </script>
</body>
</html>
